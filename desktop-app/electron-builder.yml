# owner e repo apontam para o repositório público PedroHRoseno/concord.
# A URL do sinalizador do instalador entra em VITE_SIGNALING_URL na hora do build.
appId: com.concord.app
productName: Concord
electronVersion: 45.1.0
directories:
  output: release
files:
  - out
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - "**/node_modules/loopback-capture/**"
win:
  icon: resources/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Concord
publish:
  provider: github
  owner: PedroHRoseno
  repo: concord
  releaseType: release
