name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w signaling-server
      - run: npm run typecheck -w signaling-server
      - run: npm run typecheck -w desktop-app
      - run: npm run build -w desktop-app
